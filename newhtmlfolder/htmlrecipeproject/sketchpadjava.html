<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> project sketchpad</title>
    <style>
        html{
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;

        }
        #container{
            margin:2rem;
            padding:1.25rem;
            background-color: grey;
            display: flex;
            width: fit-content;
            height: min-content;
            border: 2px solid black;
            padding: 1rem;
            flex-wrap: wrap;
            row-gap: 1.25rem;
            column-gap: 1.25rem;



        }
        .new{
            color: yellow;
            background-color: green;
            margin: 1.25rem;
            padding: 1rem;
            width: fit-content;
            flex-grow: 1;
            flex-shrink: 1;
            flex-basis: 0;
            border: 2px solid red;

        }

        .btn{
            background-color: blue;
            border-radius: 20px;
            color: white;
            font-size: 1.25rem;


        }
    </style>
</head>
<body>
    <p>
        sketch pad project
    </p>

    <button class="btn">Sketchpad Area</button>

    <!--<button onclick ="prompt('Please Enter Grid size of Choice:')">Sketchpad1 Area</button> -->
    
    <div id="container">

    </div>

    <script>
        const container = document.querySelector("#container");
        const content = document.querySelector(".content");
        const btn = document.querySelector(".btn");
        
       
        
                
         
        let divNum = 257;
        for (let i = 1; i < divNum; i++){
            const div = document.createElement("div");
            div.classList.add("new");
            div.textContent = "one of the 256 divs";
            container.appendChild(div);   
        }

        btn.addEventListener("click", gridSize);

        function gridSize(param){
                let response = Number(prompt("What Grid size do you want? Please enter your grid size for example: a 64 give a 64 x 64 grid. maximum to 100"))
                if(response >= 100){
                  console.log("number is too large, please enter a number lower than 100");

                }else {
                    console.log("number is acceptable, grid size of choice loading");
                }
                return response;
                
                let divNumNew = gridSize();
                for (let i = 1; i < divNumNew; i++){
                    const div = document.createElement("div");
                    div.classList.add("new");
                    div.textContent = "one of the user prompt divs numbers";
                    container.appendChild(div);
                }
        }
        gridSize();
        //console.log(gridSize());



    </script>
</body>
</html>
